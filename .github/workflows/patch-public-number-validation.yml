name: Patch public number validation

on:
  push:
    branches:
      - codex/canonical-integer-followup

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/canonical-integer-followup
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply patch
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/data/public_clients.py')
          text = path.read_text()
          text = text.replace(
              'from src.config import Settings\nfrom src.models import DataMode, DataPeriod, DomainModel, SourceMetadata\n',
              'from src.config import Settings\nfrom src.models import DataMode, DataPeriod, DomainModel, SourceMetadata\nfrom src.numeric_tokens import NumericTokenError, parse_canonical_decimal\n',
          )
          old = '''    try:\n        number = float(str(value).replace(",", ""))\n    except (TypeError, ValueError) as exc:\n        raise PublicDataInvalidResponseError(\n            f"invalid numeric field: {field_name}"\n        ) from exc\n    if not math.isfinite(number):\n        raise PublicDataInvalidResponseError(\n            f"non-finite numeric field: {field_name}"\n        )\n'''
          new = '''    token = str(value).strip()\n    try:\n        number = parse_canonical_decimal(token, field_name=field_name)\n    except NumericTokenError as exc:\n        raise PublicDataInvalidResponseError(\n            f"invalid numeric field: {field_name}"\n        ) from exc\n    if not math.isfinite(number):\n        raise PublicDataInvalidResponseError(\n            f"non-finite numeric field: {field_name}"\n        )\n'''
          if old not in text:
              raise SystemExit('public number parser block not found')
          path.write_text(text.replace(old, new))

          tests = Path('tests/test_public_clients.py')
          body = tests.read_text()
          marker = '''\n\n@pytest.mark.parametrize("value", ["1,2,3", "12,34", "1_000", "1e3"])\ndef test_malformed_public_numeric_tokens_are_rejected(value):\n    with pytest.raises(PublicDataInvalidResponseError):\n        _parse_number(value, field_name="passengers")\n\n\n@pytest.mark.parametrize(("value", "expected"), [("1000", 1000), ("1,000", 1000), ("1,000.5", 1000.5)])\ndef test_canonical_public_numeric_tokens_are_accepted(value, expected):\n    assert _parse_number(value, field_name="passengers") == expected\n'''
          if 'test_malformed_public_numeric_tokens_are_rejected' not in body:
              tests.write_text(body + marker)
          PY
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/data/public_clients.py tests/test_public_clients.py
          git commit -m "Validate public numeric token grouping"
          git push origin HEAD:codex/canonical-integer-followup
