name: Fix rank numeric token parsing

on:
  push:
    branches:
      - codex/canonical-integer-followup

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/canonical-integer-followup
          fetch-depth: 0
      - name: Patch direct rank numeric tokens
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/question_constraints.py')
          text = path.read_text(encoding='utf-8')
          old = '''    patterns = (\n        rf"(?<![a-z0-9])top\\s+{_INTEGER_TOKEN}",\n'''
          new = '''    patterns = (\n        rf"(?<![a-z0-9])rank(?:\\s+the)?\\s+{_INTEGER_TOKEN}",\n        rf"(?<![a-z0-9])top\\s+{_INTEGER_TOKEN}",\n'''
          if old not in text:
              raise SystemExit('rank-limit pattern block not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          rm -f pytest-failure.txt .github/workflows/capture-pytest-failure.yml
          git config user.name "omergershonwork-commits"
          git config user.email "237711942+omergershonwork-commits@users.noreply.github.com"
          git add src/question_constraints.py pytest-failure.txt .github/workflows/capture-pytest-failure.yml
          git commit -m "fix(parser): validate numeric tokens after rank"
          git push origin HEAD:codex/canonical-integer-followup
