name: Preserve canonical integer error wording

on:
  push:
    branches:
      - codex/canonical-integer-followup

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/canonical-integer-followup
          fetch-depth: 0
      - name: Preserve established error wording
        run: |
          python - <<'PY'
          from pathlib import Path
          for filename in ('src/question_constraints.py', 'src/conversation.py'):
              path = Path(filename)
              text = path.read_text(encoding='utf-8')
              text = text.replace('must be a canonical whole number ', 'must use canonical whole numbers ')
              path.write_text(text, encoding='utf-8')
          PY
          git config user.name "omergershonwork-commits"
          git config user.email "237711942+omergershonwork-commits@users.noreply.github.com"
          git add src/question_constraints.py src/conversation.py
          git commit -m "fix(parser): preserve whole-numbers error contract"
          git push origin HEAD:codex/canonical-integer-followup
