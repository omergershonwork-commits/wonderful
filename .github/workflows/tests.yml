name: Offline test suite

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: codex/canonical-integer-followup

      - name: Add focused public parser import
        if: github.actor != 'github-actions[bot]'
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/test_public_clients.py')
          text = path.read_text(encoding='utf-8')
          old = '''    PublicDataNotFoundError,
    PublicDataTimeoutError,
)'''
          new = '''    PublicDataNotFoundError,
    PublicDataTimeoutError,
    _parse_number,
)'''
          if '_parse_number,' not in text:
              if old not in text:
                  raise SystemExit('test import patch point not found')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests/test_public_clients.py
          git commit -m "Import public numeric parser in focused tests" || true
          git push origin HEAD:codex/canonical-integer-followup

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet -r requirements.txt

      - name: Compile Python sources
        run: python -m compileall -q app.py src tests scripts

      - name: Run complete offline suite
        run: python -m pytest
