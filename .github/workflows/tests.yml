name: Offline test suite

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: codex/canonical-integer-followup

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet -r requirements.txt

      - name: Compile Python sources
        run: python -m compileall -q app.py src tests scripts

      - name: Capture complete offline suite
        shell: bash
        run: |
          set +e
          python -m pytest -q > pytest-failure.txt 2>&1
          status=$?
          cat pytest-failure.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add pytest-failure.txt
          git commit -m "Capture numeric parser test failures" || true
          git push origin HEAD:codex/canonical-integer-followup
          exit $status
