name: Fix Fractional Acceptance Contract

on:
  push:
    branches:
      - codex/phase-15-comprehensive-offline-tests

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/phase-15-comprehensive-offline-tests
          fetch-depth: 0
      - name: Correct fallback error expectation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/test_offline_acceptance.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              'from src.router import AirportQuestionRouter, DeterministicFallbackRouter',
              'from src.router import (\n    AirportQuestionRouter,\n    DeterministicFallbackRouter,\n    FallbackRoutingError,\n)',
              1,
          )
          old = '    with pytest.raises(ToolArgumentsError, match="whole numbers"):\n        router.route(question)\n'
          new = '    with pytest.raises(FallbackRoutingError):\n        router.route(question)\n'
          if old not in text:
              raise SystemExit('fractional fallback assertion not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit correction
        shell: bash
        run: |
          rm .github/workflows/fix-fractional-acceptance-contract.yml
          git config user.name "omergershonwork-commits"
          git config user.email "237711942+omergershonwork-commits@users.noreply.github.com"
          git add tests/test_offline_acceptance.py .github/workflows/fix-fractional-acceptance-contract.yml
          git commit -m "test: assert public fallback error contract"
          git push origin HEAD:codex/phase-15-comprehensive-offline-tests
