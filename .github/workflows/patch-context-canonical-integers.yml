name: Patch contextual canonical integer parsing

on:
  push:
    branches:
      - codex/phase-12-conversational-context

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/phase-12-conversational-context
          fetch-depth: 0

      - name: Patch contextual parser and tests
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/conversation.py')
          text = path.read_text(encoding='utf-8')
          marker = '''METRICS: dict[str, ComparisonMetric] = {'''
          if marker not in text:
              raise SystemExit('metrics marker not found')
          insertion_point = text.index('\n\n\nclass ConversationResolutionError')
          constants = '''\n\n_INTEGER_TOKEN = r"([+-]?[0-9][0-9a-z_,.+-]*)"\n_CANONICAL_INTEGER = re.compile(r"[+-]?(?:\\d+|\\d{1,3}(?:,\\d{3})+)")'''
          if '_CANONICAL_INTEGER = re.compile' not in text:
              text = text[:insertion_point] + constants + text[insertion_point:]

          start = text.index('def _miles')
          end = text.index('class ConversationManager')
          replacement = '''def _parse_canonical_integer(token: str, *, field_name: str) -> int:\n    if _CANONICAL_INTEGER.fullmatch(token) is None:\n        raise ConversationResolutionError(\n            f"{field_name} must be a canonical whole number "\n            "with optional sign and correctly grouped commas"\n        )\n    return int(token.replace(",", ""))\n\n\ndef _miles(question: str) -> int | None:\n    match = re.search(\n        rf"(?<![a-z0-9]){_INTEGER_TOKEN}\\s*(?:statute\\s+)?miles?\\b",\n        question.casefold(),\n    )\n    if not match:\n        return None\n    value = _parse_canonical_integer(match.group(1), field_name="mileage threshold")\n    if value <= 0:\n        raise ConversationResolutionError("mileage threshold must be greater than zero")\n    return value\n\n\ndef _limit(question: str) -> int | None:\n    match = re.search(\n        rf"\\b(?:top|first|limit(?:\\s+to)?)\\s+{_INTEGER_TOKEN}",\n        question.casefold(),\n    )\n    if not match:\n        return None\n    value = _parse_canonical_integer(match.group(1), field_name="ranking limit")\n    if not 1 <= value <= 10:\n        raise ConversationResolutionError("ranking limit must be between 1 and 10")\n    return value\n\n\n'''
          text = text[:start] + replacement + text[end:]
          path.write_text(text, encoding='utf-8')

          test_path = Path('tests/test_conversation_review_fixes.py')
          tests = test_path.read_text(encoding='utf-8')
          addition = '''\n\n@pytest.mark.parametrize(\n    "question",\n    [\n        "What about top 3e1?",\n        "What about top 3_5?",\n        "What about top 3,5?",\n    ],\n)\ndef test_noncanonical_contextual_ranking_limit_fails_closed(question):\n    state = ConversationState(region="New England")\n    with pytest.raises(ConversationResolutionError, match="canonical whole number"):\n        manager().handle(question, state)\n\n\n@pytest.mark.parametrize(\n    "question",\n    [\n        "Use 2_500 miles",\n        "Use 2e3 miles",\n        "Use 2,50 miles",\n    ],\n)\ndef test_noncanonical_contextual_mileage_fails_closed(question):\n    state = ConversationState(airport_codes=("ANC",))\n    with pytest.raises(ConversationResolutionError, match="canonical whole number"):\n        manager().handle(question, state)\n\n\n@pytest.mark.parametrize(\n    ("question", "expected"),\n    [\n        ("Use 2500 miles", 2500),\n        ("Use 2,500 miles", 2500),\n        ("Use +2500 miles", 2500),\n    ],\n)\ndef test_canonical_contextual_mileage_is_preserved(question, expected):\n    state = ConversationState(airport_codes=("ANC",))\n    turn = manager().handle(question, state)\n    assert turn.execution.arguments["threshold_miles"] == expected\n'''
          if 'test_noncanonical_contextual_ranking_limit_fails_closed' not in tests:
              test_path.write_text(tests.rstrip() + addition + '\n', encoding='utf-8')
          PY

      - name: Remove temporary workflow and commit
        shell: bash
        run: |
          rm .github/workflows/patch-context-canonical-integers.yml
          git config user.name "omergershonwork-commits"
          git config user.email "237711942+omergershonwork-commits@users.noreply.github.com"
          git add src/conversation.py tests/test_conversation_review_fixes.py .github/workflows/patch-context-canonical-integers.yml
          git commit -m "fix(conversation): require canonical whole integer tokens"
          git push origin HEAD:codex/phase-12-conversational-context
