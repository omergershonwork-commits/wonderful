name: Capture pytest failure output

on:
  push:
    branches:
      - codex/canonical-integer-followup

permissions:
  contents: write

jobs:
  capture:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/canonical-integer-followup
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Capture pytest output
        run: python -m pytest -q > pytest-failure.txt 2>&1 || true
      - name: Commit diagnostic
        run: |
          git config user.name "omergershonwork-commits"
          git config user.email "237711942+omergershonwork-commits@users.noreply.github.com"
          git add pytest-failure.txt
          git commit -m "chore: capture pytest failure output"
          git push origin HEAD:codex/canonical-integer-followup
