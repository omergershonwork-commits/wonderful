name: Patch Fractional Agent Values

on:
  push:
    branches:
      - codex/phase-9-tool-calling

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/phase-9-tool-calling
          fetch-depth: 0
      - name: Patch parser and tests
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/question_constraints.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              '_SIGNED_INTEGER = r"([+-]?\\d[\\d,]*)"\n_SIGNED_NUMBER = r"([+-]?\\d+(?:\\.\\d+)?)"',
              '_SIGNED_INTEGER = r"([+-]?(?:\\d{1,3}(?:,\\d{3})+|\\d+))"\n_SIGNED_NUMBER = r"([+-]?\\d+(?:\\.\\d+)?)"\n_FRACTIONAL_INTEGER = r"[+-]?(?:\\d{1,3}(?:,\\d{3})+|\\d+)\\.\\d+"',
          )
          anchor = '\n\ndef _rank_limit(question: str) -> int | None:\n'
          helper = '''\n\ndef _reject_fractional_integer_overrides(question: str) -> None:\n    lowered = question.casefold()\n    patterns = (\n        rf"(?<![a-z0-9])(?:top|first|limit(?:ed)?(?:\\s+to)?)\\s+{_FRACTIONAL_INTEGER}(?![\\d.])",\n        rf"(?<![a-z0-9.,]){_FRACTIONAL_INTEGER}\\s*(?:statute\\s+)?miles?(?![a-z0-9])",\n        rf"(?<![a-z0-9.,]){_FRACTIONAL_INTEGER}\\s+(?:airports|candidates)(?![a-z0-9])",\n    )\n    if any(re.search(pattern, lowered) for pattern in patterns):\n        raise ToolArgumentsError(\n            "ranking limits and mileage thresholds must be whole numbers"\n        )\n'''
          if '_reject_fractional_integer_overrides' not in text:
              text = text.replace(anchor, helper + anchor, 1)
          text = text.replace('(?![\\d,])', '(?![\\d,.])')
          text = text.replace(
              'rf"(?<![a-z0-9]){_SIGNED_INTEGER}\\s*(?:statute\\s+)?miles?(?![a-z0-9])",',
              'rf"(?<![a-z0-9.,]){_SIGNED_INTEGER}(?![\\d,.])\\s*(?:statute\\s+)?miles?(?![a-z0-9])",',
          )
          parse_anchor = 'def parse_question_constraints(question: str) -> QuestionConstraints:\n    text = _normalized_text(question)\n'
          parse_replacement = 'def parse_question_constraints(question: str) -> QuestionConstraints:\n    _reject_fractional_integer_overrides(question)\n    text = _normalized_text(question)\n'
          if parse_anchor not in text:
              raise SystemExit('parse anchor not found')
          text = text.replace(parse_anchor, parse_replacement, 1)
          path.write_text(text, encoding='utf-8')

          tests = Path('tests/test_agent_grounding.py')
          test_text = tests.read_text(encoding='utf-8')
          addition = '''\n\n@pytest.mark.parametrize(\n    ("tool_name", "arguments", "question"),\n    [\n        (\n            "calculate_long_haul_share",\n            {"airport_code": "ANC", "threshold_miles": 5},\n            "What share of ANC flights are long haul using 2,500.5 miles?",\n        ),\n        (\n            "calculate_long_haul_share",\n            {"airport_code": "ANC", "threshold_miles": 5},\n            "What share of ANC flights are long haul using 2500.5 miles?",\n        ),\n        (\n            "rank_airports",\n            {"region": "New England", "limit": 3, "excluded_airports": []},\n            "Rank the top 3.5 New England airports",\n        ),\n    ],\n)\ndef test_fractional_values_in_integer_only_fields_fail_closed(\n    tool_name, arguments, question\n):\n    with pytest.raises(ToolArgumentsError, match="whole numbers"):\n        route(tool_name, arguments, question)\n'''
          if 'test_fractional_values_in_integer_only_fields_fail_closed' not in test_text:
              tests.write_text(test_text.rstrip() + addition + '\n', encoding='utf-8')
          PY
      - name: Commit patch
        shell: bash
        run: |
          rm .github/workflows/patch-fractional-agent.yml
          git config user.name "omergershonwork-commits"
          git config user.email "237711942+omergershonwork-commits@users.noreply.github.com"
          git add src/question_constraints.py tests/test_agent_grounding.py .github/workflows/patch-fractional-agent.yml
          git commit -m "fix(agent): reject fractional integer overrides"
          git push origin HEAD:codex/phase-9-tool-calling
