name: Apply canonical integer fix

on:
  push:
    branches:
      - codex/canonical-integer-followup

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/canonical-integer-followup
          fetch-depth: 0

      - name: Patch parsers and tests
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          q = Path('src/question_constraints.py')
          text = q.read_text(encoding='utf-8')
          text = text.replace(
              '_SIGNED_INTEGER = r"([+-]?(?:\\d{1,3}(?:,\\d{3})+|\\d+))"\n_SIGNED_NUMBER = r"([+-]?\\d+(?:\\.\\d+)?)"\n_FRACTIONAL_INTEGER = r"[+-]?(?:\\d{1,3}(?:,\\d{3})+|\\d+)\\.\\d+"\n',
              '_SIGNED_NUMBER = r"([+-]?\\d+(?:\\.\\d+)?)"\n_INTEGER_TOKEN = r"([+-]?[0-9](?:[0-9a-z_]|[.,](?=[0-9])|[+-](?=[0-9]))*)"\n_CANONICAL_INTEGER = re.compile(r"[+-]?(?:\\d+|\\d{1,3}(?:,\\d{3})+)")\n',
              1,
          )
          start = text.index('def _reject_fractional_integer_overrides')
          end = text.index('def _target_load_factor')
          text = text[:start] + '''def _parse_canonical_integer(token: str, *, field_name: str) -> int:\n    if _CANONICAL_INTEGER.fullmatch(token) is None:\n        raise ToolArgumentsError(\n            f"{field_name} must be a canonical whole number "\n            "with optional sign and correctly grouped commas"\n        )\n    return int(token.replace(",", ""))\n\n\ndef _rank_limit(question: str) -> int | None:\n    lowered = question.casefold()\n    patterns = (\n        rf"(?<![a-z0-9])top\\s+{_INTEGER_TOKEN}",\n        rf"(?<![a-z0-9])limit(?:ed)?(?:\\s+to)?\\s+{_INTEGER_TOKEN}",\n        rf"(?<![a-z0-9])first\\s+{_INTEGER_TOKEN}",\n        rf"(?<![a-z0-9]){_INTEGER_TOKEN}\\s+(?:airports|candidates)(?![a-z0-9])",\n    )\n    for pattern in patterns:\n        match = re.search(pattern, lowered)\n        if match:\n            return _parse_canonical_integer(match.group(1), field_name="ranking limit")\n    return None\n\n\ndef _threshold_miles(question: str) -> int | None:\n    match = re.search(\n        rf"(?<![a-z0-9]){_INTEGER_TOKEN}\\s*(?:statute\\s+)?miles?(?![a-z0-9])",\n        question.casefold(),\n    )\n    if not match:\n        return None\n    return _parse_canonical_integer(match.group(1), field_name="mileage threshold")\n\n\n''' + text[end:]
          text = text.replace('    _reject_fractional_integer_overrides(question)\n', '', 1)
          q.write_text(text, encoding='utf-8')

          c = Path('src/conversation.py')
          text = c.read_text(encoding='utf-8')
          marker = '\n\n\nclass ConversationResolutionError'
          if '_CANONICAL_INTEGER = re.compile' not in text:
              text = text.replace(marker, '\n\n_INTEGER_TOKEN = r"([+-]?[0-9](?:[0-9a-z_]|[.,](?=[0-9])|[+-](?=[0-9]))*)"\n_CANONICAL_INTEGER = re.compile(r"[+-]?(?:\\d+|\\d{1,3}(?:,\\d{3})+)")' + marker, 1)
          start = text.index('def _miles')
          end = text.index('class ConversationManager')
          text = text[:start] + '''def _parse_canonical_integer(token: str, *, field_name: str) -> int:\n    if _CANONICAL_INTEGER.fullmatch(token) is None:\n        raise ConversationResolutionError(\n            f"{field_name} must be a canonical whole number "\n            "with optional sign and correctly grouped commas"\n        )\n    return int(token.replace(",", ""))\n\n\ndef _miles(question: str) -> int | None:\n    match = re.search(\n        rf"(?<![a-z0-9]){_INTEGER_TOKEN}\\s*(?:statute\\s+)?miles?\\b",\n        question.casefold(),\n    )\n    if not match:\n        return None\n    value = _parse_canonical_integer(match.group(1), field_name="mileage threshold")\n    if value <= 0:\n        raise ConversationResolutionError("mileage threshold must be greater than zero")\n    return value\n\n\ndef _limit(question: str) -> int | None:\n    match = re.search(\n        rf"\\b(?:top|first|limit(?:\\s+to)?)\\s+{_INTEGER_TOKEN}",\n        question.casefold(),\n    )\n    if not match:\n        return None\n    value = _parse_canonical_integer(match.group(1), field_name="ranking limit")\n    if not 1 <= value <= 10:\n        raise ConversationResolutionError("ranking limit must be between 1 and 10")\n    return value\n\n\n''' + text[end:]
          c.write_text(text, encoding='utf-8')

          additions = {
              Path('tests/test_agent_grounding.py'): '''\n\n@pytest.mark.parametrize(\n    ("tool_name", "arguments", "question"),\n    [\n        ("rank_airports", {"region": "New England", "limit": 3, "excluded_airports": []}, "Rank the top 3e1 New England airports"),\n        ("rank_airports", {"region": "New England", "limit": 3, "excluded_airports": []}, "Rank the top 3_5 New England airports"),\n        ("rank_airports", {"region": "New England", "limit": 5, "excluded_airports": []}, "Rank 3,5 New England airports"),\n        ("calculate_long_haul_share", {"airport_code": "ANC", "threshold_miles": 500}, "What share of ANC flights are long haul using 2_500 miles?"),\n        ("calculate_long_haul_share", {"airport_code": "ANC"}, "What share of ANC flights are long haul using 2e3 miles?"),\n        ("calculate_long_haul_share", {"airport_code": "ANC"}, "What share of ANC flights are long haul using 2,50 miles?"),\n    ],\n)\ndef test_noncanonical_integer_tokens_fail_closed(tool_name, arguments, question):\n    with pytest.raises(ToolArgumentsError, match="canonical whole number"):\n        route(tool_name, arguments, question)\n''',
              Path('tests/test_conversation_review_fixes.py'): '''\n\n@pytest.mark.parametrize("question", ["What about top 3e1?", "What about top 3_5?", "What about top 3,5?"])\ndef test_noncanonical_contextual_ranking_limit_fails_closed(question):\n    state = ConversationState(region="New England")\n    with pytest.raises(ConversationResolutionError, match="canonical whole number"):\n        manager().handle(question, state)\n\n\n@pytest.mark.parametrize("question", ["Use 2_500 miles", "Use 2e3 miles", "Use 2,50 miles"])\ndef test_noncanonical_contextual_mileage_fails_closed(question):\n    state = ConversationState(airport_codes=("ANC",))\n    with pytest.raises(ConversationResolutionError, match="canonical whole number"):\n        manager().handle(question, state)\n''',
              Path('tests/test_offline_acceptance.py'): '''\n\n@pytest.mark.parametrize(\n    "question",\n    [\n        "Rank the top 3e1 New England airports",\n        "Rank the top 3_5 New England airports",\n        "Rank 3,5 New England airports",\n        "What share of ANC flights are long haul using 2_500 miles?",\n        "What share of ANC flights are long haul using 2e3 miles?",\n        "What share of ANC flights are long haul using 2,50 miles?",\n    ],\n)\ndef test_noncanonical_integer_tokens_fail_in_complete_offline_path(offline_runtime, question):\n    _, _, router = offline_runtime\n    with pytest.raises(FallbackRoutingError):\n        router.route(question)\n\n\n@pytest.mark.parametrize(\n    ("question", "state"),\n    [\n        ("What about top 3e1?", ConversationState(region="New England")),\n        ("What about top 3_5?", ConversationState(region="New England")),\n        ("Use 2_500 miles", ConversationState(airport_codes=("ANC",))),\n        ("Use 2e3 miles", ConversationState(airport_codes=("ANC",))),\n        ("Use 2,50 miles", ConversationState(airport_codes=("ANC",))),\n    ],\n)\ndef test_noncanonical_contextual_tokens_fail_in_complete_offline_path(offline_runtime, question, state):\n    policy, dispatcher, router = offline_runtime\n    manager = ConversationManager(router, dispatcher, policy=policy)\n    with pytest.raises(ConversationResolutionError, match="canonical whole number"):\n        manager.handle(question, state)\n''',
          }
          for path, addition in additions.items():
              current = path.read_text(encoding='utf-8')
              sentinel = addition.split('def ', 1)[1].split('(', 1)[0]
              if sentinel not in current:
                  path.write_text(current.rstrip() + addition + '\n', encoding='utf-8')
          PY

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "omergershonwork-commits"
          git config user.email "237711942+omergershonwork-commits@users.noreply.github.com"
          git add src/question_constraints.py src/conversation.py tests/test_agent_grounding.py tests/test_conversation_review_fixes.py tests/test_offline_acceptance.py
          git commit -m "fix(parser): reject noncanonical integer tokens"
          git push origin HEAD:codex/canonical-integer-followup
